# Configuración aparte, y ése es el punto: `pytest.ini` apunta a `tests/`, que es
# lo que corre el CI —sin ningún motor instalado— y no debe intentar hablar con
# nadie. Estas pruebas necesitan los tres servicios levantados, así que se piden
# a mano y con su propio archivo:
#
#     docker compose up -d
#     pytest -c pytest-integration.ini
#
# Sin cobertura: no miden qué líneas se ejecutan sino si el contrato entre este
# servicio y los motores sigue en pie, y escribir `coverage.xml` acá pisaría el
# del CI.
[pytest]
asyncio_mode = auto
pythonpath = .
testpaths = integration_tests
addopts = -v -p no:cacheprovider --no-cov
markers =
    integracion: necesita los servicios de motor levantados (docker compose up -d)
