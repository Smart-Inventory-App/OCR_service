name: Release guard

on:
  push:
    branches: [production]

permissions:
  contents: read
  pull-requests: read

jobs:
  approved-pr:
    name: Approved release PR
    runs-on: ubuntu-latest

    steps:
      - name: Verify the commit comes from an approved PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          pr=$(gh pr list -R "$REPO" --base production --state merged --limit 50 \
                 --json number,mergeCommit,author \
                 --jq ".[] | select(.mergeCommit.oid == \"$SHA\")")

          if [ -z "$pr" ]; then
            echo "::error::$SHA no es el merge de un PR hacia production (push directo). No se deploya."
            exit 1
          fi

          number=$(jq -r .number <<<"$pr")
          author=$(jq -r .author.login <<<"$pr")
          approvers=$(gh api "repos/$REPO/pulls/$number/reviews" --paginate \
                        --jq ".[] | select(.state == \"APPROVED\" and .user.login != \"$author\") | .user.login" \
                      | sort -u | paste -sd, -)

          if [ -z "$approvers" ]; then
            echo "::error::El PR #$number no tiene una aprobación de alguien distinto de su autor ($author). No se deploya."
            exit 1
          fi

          echo "PR #$number de $author, aprobado por: $approvers"
