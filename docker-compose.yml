services:

  ocr:
    build: .
    container_name: tpp_ocr
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      STORAGE_SERVICE_URL: http://tpp_storage_service:8000
      TESSERACT_SERVICE_URL: http://tpp_ocr_tesseract:8005
      PADDLEOCR_SERVICE_URL: http://tpp_ocr_paddleocr:8007,http://tpp_ocr_paddleocr_2:8007
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tpp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/ocr/livez"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    command: python -m app.worker
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      STORAGE_SERVICE_URL: http://tpp_storage_service:8000
      TESSERACT_SERVICE_URL: http://tpp_ocr_tesseract:8005
      PADDLEOCR_SERVICE_URL: http://tpp_ocr_paddleocr:8007,http://tpp_ocr_paddleocr_2:8007
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tpp-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tpp_ocr_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - tpp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:

networks:
  tpp-net:
    external: true
    name: tpp-net
